<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#1a1209"/>
  <!-- terracotta-to-gold accent bar across the top -->
  <rect x="0" y="0" width="32" height="3" rx="3" fill="url(#bar)"/>
  <!-- stylised "C" for Crave -->
  <text
    x="16" y="23"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#gold)"
  >C</text>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d57b"/>
      <stop offset="100%" stop-color="#c17f1b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5451b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
</svg>
